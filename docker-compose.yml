services:
  xteink:
    build: .
    # On the nginx-proxy-manager `proxy` bridge network so NPM can reverse-proxy
    # to it by name (xteink:8090) — e.g. for a DuckDNS domain with HTTPS. Port
    # 8090 is also published so the X4 can still sync directly to the host at
    # :8090 during the transition.
    #
    # This replaces the previous `network_mode: host`: Docker forbids combining
    # host mode with a bridge network, and the proxy network is what NPM needs.
    # Device discovery still works — crosspoint.local resolves via libnss-mdns
    # talking to the host avahi socket (mounted below), and the resulting LAN IP
    # is reachable from the bridge through the host's routing.
    networks:
      - proxy
    ports:
      - "8090:8090"
    volumes:
      - /srv/docker/data/syncthing/shares/xteink-vault:/data/vault
      - /srv/docker/data/xteink-x4-commonplace/config:/data/config
      - /srv/docker/data/xteink-x4-commonplace/state:/data/state
      # Host avahi-daemon socket — nss-mdns in the container resolves
      # crosspoint.local through the same avahi the host uses. The container
      # has no avahi of its own, so without this .local never resolves.
      - /run/avahi-daemon/socket:/run/avahi-daemon/socket
    environment:
      # At home:      DEVICE_HOST=crosspoint.local  (default; resolved via
      #               libnss-mdns + the mounted host avahi socket)
      # Via Tailscale: DEVICE_HOST=100.x.x.x  (X4's Tailscale IP)
      # Fallback if mDNS is unavailable: set DEVICE_HOST to a static IP, or
      # pin the name with extra_hosts below.
      - DEVICE_HOST=crosspoint.local
      - VAULT_PATH=/data/vault
      - STATE_DB=/data/state/state.db
      - KOREADER_DB=/data/state/koreader.db
      # Optional: set to your ntfy.sh topic URL to get push notifications
      # - NTFY_TOPIC=https://ntfy.sh/your-topic-here
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      # KOReader sync auth (kosync x-auth). Set both to require the X4 to send a
      # matching username + key (KOReader sends x-auth-key = md5(password)).
      # Leave unset for an open, LAN-only server; SET THESE when exposing the
      # server publicly via NPM/DuckDNS. On the X4: KOReader > Progress sync,
      # use the same username + password. NOT HTTP Basic Auth — do not add an
      # NPM Access List to the sync host, it would 401 the X4.
      - KOSYNC_USER=xteink
      - KOSYNC_PASSWORD=${KOSYNC_PASSWORD}
      # Exposing ONLY the sync publicly (NPM/DuckDNS): set this to that public
      # hostname so the web UI + /api are refused on it (kept LAN/Tailscale only),
      # while the kosync endpoints stay reachable there.
      - PUBLIC_SYNC_HOST=read.ghostbird.duckdns.org
      # The human web UI is exposed separately at xteink.ghostbird.duckdns.org via
      # a SECOND NPM proxy host (also -> xteink:8090) guarded by an NPM Access List
      # (HTTP Basic Auth). That host is NOT PUBLIC_SYNC_HOST, so the full UI/API
      # serve there. Keep the Basic Auth Access List OFF read.* (it would 401 the
      # X4's kosync). The Android app embeds those Basic Auth creds in its URL
      # (web/capacitor.config.ts, injected via APP_BASIC_AUTH at `cap sync`).
    # Fallback if in-container mDNS ever fails — pin the device IP here:
    # extra_hosts:
    #   - "crosspoint.local:192.168.x.x"
    restart: unless-stopped

  # SECURITY TRADEOFF, READ BEFORE CHANGING THIS SERVICE
  #
  # This container mounts the host Docker socket so its pipelines can deploy
  # per-branch preview stacks and update the production container. Access to
  # that socket is effectively root on the host: anything that can talk to it
  # can start a privileged container that bind-mounts / and then edit any file
  # on the machine. There is no container boundary left once the socket is in.
  #
  # Accepted here because Jenkins is reachable only over Tailscale/LAN (never
  # published to the public internet) and runs only trusted first-party jobs
  # from this repo. If either of those stops being true, harden it: put a
  # socket proxy in front (e.g. tecnativa/docker-socket-proxy allowing only the
  # container/image/exec endpoints the jobs actually need) and point DOCKER_HOST
  # at the proxy, or move the host to rootless Docker. Neither is implemented
  # today, on purpose, to keep the deploy path simple.
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: xteink-jenkins:latest
    container_name: jenkins
    ports:
      # Bind to Tailscale interface only — not exposed on the public internet.
      # Replace 100.x.x.x with this machine's Tailscale IP (`tailscale ip -4`).
      # To also allow LAN access, use 0.0.0.0 and rely on your firewall (ufw).
      - "8888:8080"
      - "50000:50000"
    # The jenkins user (uid 1000) also gets the host docker group here, in
    # addition to the matching group baked into Dockerfile.jenkins. Keep both:
    # the image mapping breaks silently if the host gid ever changes, and this
    # line is what keeps the socket usable when it does.
    group_add:
      - "989"
    volumes:
      - /srv/docker/data/jenkins:/var/jenkins_home
      # Host Docker daemon. See the security note above.
      - /var/run/docker.sock:/var/run/docker.sock
      # Preview stacks' data lives here. Jenkins creates one subdirectory per
      # branch on deploy and deletes it when the branch is torn down.
      - /srv/docker/data/xteink-previews:/srv/docker/data/xteink-previews
      # Production state, READ-ONLY. Preview seeding copies state.db out of
      # this; :ro makes it impossible for a pipeline bug to write back into the
      # live database.
      - /srv/docker/data/xteink-x4-commonplace/state:/prod-state:ro
    # BIND-MOUNT PATHS IN PIPELINES: USE ABSOLUTE HOST PATHS ONLY.
    #
    # `docker compose` run inside Jenkins is only a client. The daemon doing
    # the work is the host's, so it resolves every bind-mount source against
    # the HOST filesystem, not against the Jenkins container. A relative path,
    # or anything under the Jenkins workspace (/var/jenkins_home/workspace/...),
    # does not exist from the daemon's point of view: it will silently create
    # an empty directory at that path on the host and mount that instead, and
    # the preview comes up with no data and no error.
    #
    # So preview compose files must reference /srv/docker/data/xteink-previews/
    # (mounted above at the same path inside and outside, which is why the path
    # is identical on both sides) and never ./data or $WORKSPACE/data.
    environment:
      - TZ=America/Toronto
    restart: unless-stopped

networks:
  # Shared with nginx-proxy-manager (created by the main homelab compose).
  proxy:
    external: true
